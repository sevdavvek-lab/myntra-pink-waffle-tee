<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Men's Pink Waffle T-Shirt</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f6f6;color:#282c3f}
.top{background:#fff;padding:18px 16px;border-bottom:1px solid #eee;font-weight:700;font-size:20px}
.brand{color:#ff3f6c;letter-spacing:1px}
.card{background:#fff;margin:14px auto;max-width:520px;padding-bottom:24px}
.product{padding:20px 16px}.tag{display:inline-block;background:#f5f5f6;padding:6px 9px;font-size:11px;font-weight:700;margin-bottom:12px}
h1{font-size:20px;margin:8px 0}.sub{color:#696e7c;font-size:14px}.price{font-size:18px;font-weight:700;margin:18px 0}
.btn{display:block;width:100%;border:0;background:#ff3f6c;color:white;padding:16px;font-size:15px;font-weight:700;border-radius:3px}
.hidden{display:none}.reveal{text-align:center;padding:22px 16px}.reveal img{width:100%;max-height:72vh;object-fit:contain;border-radius:4px}
.love{font-size:25px;font-weight:700;margin:18px 0 8px}.msg{color:#696e7c;font-size:15px;line-height:1.5}
</style>
</head>
<body>
<div class="top"><span class="brand">MYNTRA</span></div>
<div class="card">
  <div id="product" class="product">
    <div class="tag">NEW</div>
    <h1>Men Pink Waffle Knit T-Shirt</h1>
    <div class="sub">Casual • Regular Fit • Soft Fabric</div>
    <div class="price">₹799</div>
    <button class="btn" onclick="reveal()">VIEW PRODUCT</button>
  </div>
  <div id="reveal" class="reveal hidden">
    <img src="photo.jpg" alt="Surprise">
    <div class="love">Plot twist 👀❤️</div>
    <div class="msg">You thought you were getting a T-shirt link.</div>
  </div>
</div>
<script>
function reveal(){
 document.getElementById('product').classList.add('hidden');
 document.getElementById('reveal').classList.remove('hidden');
 window.scrollTo(0,0);
}
</script>
</body>
</html>
